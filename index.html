<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>The Mastoid Processor</title>
<style>
:root{--bg:#ece3d0;--card:#f7f0e0;--ink:#2a2622;--dim:#7a7064;--line:#d8ccb4;--acc:#e8541e;--tl:#2f8a82;--mx:#7b4fb8;--ma:#c23b77;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1816;--card:#262320;--ink:#efe6d2;--dim:#9a9082;--line:#3b362f;--acc:#ff6a2b;--tl:#3fb8ae;--mx:#a98be0;--ma:#ff7aa9;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1816;--card:#262320;--ink:#efe6d2;--dim:#9a9082;--line:#3b362f;--acc:#ff6a2b;--tl:#3fb8ae;--mx:#a98be0;--ma:#ff7aa9;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Rounded",system-ui,sans-serif;touch-action:manipulation;overscroll-behavior:none}
body{display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:430px;margin:0 auto;padding:8px;display:flex;flex-direction:column;justify-content:center;gap:8px}
header{text-align:center}
h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.02em}
#info{font-size:12px;color:var(--dim);margin-top:2px;min-height:15px}
svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{--c:var(--acc);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,box-shadow .15s}
#c2{--c:var(--tl)}#c3{--c:var(--mx)}
.card.on{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.head{display:flex;align-items:center;gap:10px}
.badge{width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none;will-change:transform}
.badge svg{width:20px;height:20px}
.ttl b{display:block;font-size:15px}
.ttl small{color:var(--dim);font-size:12px}
.now{margin-left:auto;display:none;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--c)}
.card.on .now{display:flex}
.now b{display:flex;gap:3px;align-items:flex-end;height:16px}
.now i{width:4px;height:30%;background:var(--c);border-radius:2px;animation:eq .8s ease-in-out infinite}
.now i:nth-child(2){animation-delay:.25s}.now i:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
@media (prefers-reduced-motion:reduce){.now i{animation:none;height:70%}}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.row.two{grid-template-columns:repeat(2,1fr)}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:clamp(46px,7.5vh,64px);padding:6px 2px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:600 11.5px/1.2 -apple-system,system-ui,sans-serif;cursor:pointer}
.btn.main{background:var(--c);border-color:var(--c);color:#fff}
.btn:disabled{opacity:.35;cursor:default}
.btn:active:not(:disabled){transform:scale(.96)}
.btn.busy{opacity:.7}
.btn .i-play,.btn .i-pause{fill:currentColor;stroke:none}
.btn .i-pause{display:none}.btn.is-playing .i-play{display:none}.btn.is-playing .i-pause{display:block}
.btn.is-playing{border-color:var(--c);color:var(--c)}
.btn svg{width:20px;height:20px}
.panel{--c:var(--acc);gap:8px}
.ctl{display:flex;align-items:center;gap:10px}
.ctl>svg{stroke:var(--dim)}
.lab{width:46px;font-size:13px;font-weight:600;color:var(--dim)}
.ctl input{flex:1;min-width:0;accent-color:var(--acc);height:28px}
#bv{min-width:3ch;text-align:right;font-weight:700;font-size:16px}
.u{font-size:11px;color:var(--dim);font-weight:600}
#keysel,#modesel{padding:6px 10px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:700 16px -apple-system,system-ui,sans-serif}
#mode{display:inline-flex;margin-left:auto;padding:0;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:transparent;cursor:pointer;font:600 14px -apple-system,system-ui,sans-serif}
#mode span{padding:6px 10px;color:var(--dim)}
#mode[data-mode="maj"] span:first-child,#mode[data-mode="min"] span:last-child{background:var(--acc);color:#fff}
#init{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;z-index:10;
padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
#init svg.big{width:64px;height:64px;color:var(--acc)}
#init p{max-width:280px;font-size:15px;line-height:1.5;color:var(--dim);margin:0}
#init small{font-size:12px;color:var(--dim)}
#start{--c:var(--acc);flex-direction:row;gap:10px;padding:16px 30px;font-size:17px;border-radius:999px}
#init.hide{display:none}
.chip{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--dim);font:600 12px -apple-system,system-ui,sans-serif;cursor:pointer;white-space:nowrap;flex:none}
.chip svg{width:16px;height:16px}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
#c2 .now span{display:none}
.sec{display:flex;gap:4px;align-items:stretch}
.sec .card{flex:1;min-width:0}
.nav{width:26px;flex:none;border:1.5px solid var(--line);border-radius:12px;background:transparent;display:grid;place-items:center;padding:0;cursor:pointer}
#s1 .nav{color:var(--acc)}#s2 .nav{color:var(--tl)}#s3 .nav{color:var(--mx)}
.nav svg{width:20px;height:20px}
.nav:disabled{opacity:.25;cursor:default}
.nav:active:not(:disabled){transform:scale(.94)}
html,body{overflow-x:hidden}
.head{min-width:0}.ttl{min-width:0}
#mixb .i-shuf{display:none}#mixb.is-reshuffle .i-shuf{display:block}#mixb.is-reshuffle .i-blend{display:none}
#modesel{flex:1;min-width:0;margin-left:auto}
.rng{padding:8px 10px;gap:6px}
.rtop{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--dim)}
#rv{color:var(--ink);font-weight:700}
.rbar{position:relative;height:30px}
.rin{position:absolute;left:9px;right:9px;top:0;bottom:0}
.rin i{position:absolute;top:10px;bottom:10px;width:1px;background:var(--line);transform:translateX(-.5px)}
.rin i.b{top:7px;bottom:7px;background:var(--dim);opacity:.6}
#rfill{position:absolute;top:9px;bottom:9px;background:var(--acc);opacity:.28;border-radius:3px}
#ph{position:absolute;top:2px;bottom:2px;width:2px;background:var(--ink);border-radius:1px;transform:translateX(-1px);display:none}
.rbar input{position:absolute;left:0;top:0;width:100%;height:100%;margin:0;background:none;-webkit-appearance:none;appearance:none;pointer-events:none;outline:none}
.rbar input::-webkit-slider-runnable-track{background:none;height:30px}
.rbar input::-webkit-slider-thumb{-webkit-appearance:none;box-sizing:border-box;pointer-events:auto;width:18px;height:30px;border-radius:7px;background:var(--acc);border:2px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.rbar input::-moz-range-track{background:none}
.rbar input::-moz-range-thumb{box-sizing:border-box;pointer-events:auto;width:18px;height:30px;border-radius:7px;background:var(--acc);border:2px solid var(--card)}
.steps{display:flex;gap:4px}
.stp{flex:1;min-width:0;height:36px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:700 14px -apple-system,system-ui,sans-serif;cursor:pointer;padding:0}
.stp.on{background:var(--acc);border-color:var(--acc);color:#fff}
.stp:active{transform:scale(.95)}
.sec .card{display:grid;grid-template-columns:repeat(4,1fr);column-gap:6px;align-items:center;padding:8px}
.sec .head{flex-direction:column;gap:2px;text-align:center;min-width:0}
.sec .ttl b{font-size:13px}
.sec .badge{width:34px;height:34px}
.now{margin:0;display:flex!important;visibility:hidden;height:12px;align-items:flex-end;justify-content:center}
.card.on .now{visibility:visible}
.now b{height:12px}
#c3 #pp3{grid-column:3}#c3 #mixb{grid-column:4}
.sec .chip{padding:3px 7px;font-size:11px;gap:3px}.sec .chip svg{width:13px;height:13px}
.rng{flex-direction:row;align-items:center;gap:8px;padding:6px 8px}
.rl{font-size:11px;font-weight:700;color:var(--dim);width:34px}
.steps{flex:1;min-width:0}
.stp{height:32px}
#c4{--c:var(--ma)}#s4 .nav{color:var(--ma)}
</style>
</head>
<body>
<div id="init">
  <svg class="big" viewBox="0 0 24 24"><polyline points="3 17 9 7 9 17 15 7 15 17 21 7"/></svg>
  <h1>The Mastoid Processor</h1>
  <p>Random breakbeats chopped from imaginary analog synth records.</p>
  <button id="start" class="btn main"><svg class="i-play" viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M7 4.5v15l13-7.5z"/></svg><span class="t">Tap to start</span></button>
  <small>Turn your volume up. Sound plays even with the silent switch on.</small>
</div>
<main>
  <header hidden><div id="info">Tap “New loop” to make a beat</div></header>
  <section class="card rng" aria-label="Loop length in steps"><span class="rl">Steps</span><div class="steps"><button class="stp" data-n="1">1</button><button class="stp" data-n="4">4</button><button class="stp" data-n="5">5</button><button class="stp" data-n="6">6</button><button class="stp" data-n="7">7</button><button class="stp" data-n="8">8</button><button class="stp" data-n="16">16</button><button class="stp on" data-n="32">32</button></div></section>
  <div class="sec" id="s1"><button id="hb1" class="nav" disabled aria-label="Previous synth loop"><svg viewBox="0 0 24 24"><polyline points="15 6 9 12 15 18"/></svg></button><section class="card" id="c1">
    <div class="head"><div class="badge" id="b1"><svg viewBox="0 0 24 24"><polyline points="3 17 9 7 9 17 15 7 15 17 21 7"/></svg></div><div class="ttl"><b>Synth break</b></div><div class="now"><b><i></i><i></i><i></i></b></div></div>
    <button id="go" class="btn main" aria-label="Make a new synth loop"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor" stroke="none"/></svg><span class="t">New loop</span></button><button id="pp1" class="btn" disabled aria-label="Play or pause the synth loop"><svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.5" height="14" rx="1"/><rect x="13.5" y="5" width="4.5" height="14" rx="1"/></svg><span class="t">Play</span></button><button id="rr1" class="btn" disabled aria-label="Reshuffle the slices of the synth loop"><svg viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg><span class="t">Reshuffle</span></button>
  </section><button id="hf1" class="nav" disabled aria-label="Next synth loop"><svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg></button></div>
  <div class="sec" id="s2"><button id="hb2" class="nav" disabled aria-label="Previous 808 loop"><svg viewBox="0 0 24 24"><polyline points="15 6 9 12 15 18"/></svg></button><section class="card" id="c2">
    <div class="head"><div class="badge" id="b2"><svg viewBox="0 0 24 24"><path d="M2 12c2-9 4-9 6 0s4 9 6 0 4-9 6 0"/></svg></div><div class="ttl"><b>808 fold</b></div><button id="dr" class="chip" aria-pressed="false" aria-label="Add drums (kick, snare, hi-hat) to the 808"><svg viewBox="0 0 24 24"><path d="M3 9c4-3 14-3 18 0"/><path d="M3 12c4 3 14 3 18 0"/><path d="M12 15v6"/></svg><span>Drums</span></button></div>
    <button id="go2" class="btn main" aria-label="Make a new 808 loop"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor" stroke="none"/></svg><span class="t">New loop</span></button><button id="pp2" class="btn" disabled aria-label="Play or pause the 808"><svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.5" height="14" rx="1"/><rect x="13.5" y="5" width="4.5" height="14" rx="1"/></svg><span class="t">Play</span></button><button id="rr2" class="btn" disabled aria-label="Reshuffle the slices of the 808"><svg viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg><span class="t">Reshuffle</span></button>
  </section><button id="hf2" class="nav" disabled aria-label="Next 808 loop"><svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg></button></div>
  <div class="sec" id="s4"><button id="hb4" class="nav" disabled aria-label="Previous melody loop"><svg viewBox="0 0 24 24"><polyline points="15 6 9 12 15 18"/></svg></button><section class="card" id="c4">
    <div class="head"><div class="badge" id="b4"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div><div class="ttl"><b>Melody</b></div><button id="mm" class="chip" aria-pressed="false" aria-label="Chop the melody up and mix it into the current beat loop"><svg viewBox="0 0 24 24"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg><span>Mix in</span></button></div>
    <button id="go4" class="btn main" aria-label="Make a new melody: new notes and a new synth sound"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor" stroke="none"/></svg><span class="t">New loop</span></button><button id="pp4" class="btn" disabled aria-label="Play or pause the melody"><svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.5" height="14" rx="1"/><rect x="13.5" y="5" width="4.5" height="14" rx="1"/></svg><span class="t">Play</span></button><button id="rr4" class="btn" disabled aria-label="Reshuffle the melody: new notes, same synth sound"><svg viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg><span class="t">Reshuffle</span></button>
  </section><button id="hf4" class="nav" disabled aria-label="Next melody loop"><svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg></button></div>
  <div class="sec" id="s3"><button id="hb3" class="nav" disabled aria-label="Previous blend loop"><svg viewBox="0 0 24 24"><polyline points="15 6 9 12 15 18"/></svg></button><section class="card" id="c3">
    <div class="head"><div class="badge" id="b3"><svg viewBox="0 0 24 24"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg></div><div class="ttl"><b>Blend</b></div><div class="now"><b><i></i><i></i><i></i></b></div></div>
    <button id="pp3" class="btn" disabled aria-label="Play or pause the blend"><svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.5" height="14" rx="1"/><rect x="13.5" y="5" width="4.5" height="14" rx="1"/></svg><span class="t">Play</span></button><button id="mixb" class="btn main" aria-label="Blend the synth loop and the 808, then reshuffle the blend"><svg class="i-blend" viewBox="0 0 24 24"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg><svg class="i-shuf" viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg><span class="t">Blend</span></button>
  </section><button id="hf3" class="nav" disabled aria-label="Next blend loop"><svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg></button></div>
  <section class="card panel">
    <div class="ctl"><button id="auto" class="chip" aria-pressed="false" aria-label="Auto: change something at random every 2 bars"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></svg><span>Auto</span></button><input type="range" id="bpmr" min="60" max="160" value="100" aria-label="Tempo in BPM"><span id="bv">100</span><span class="u">BPM</span></div>
    <div class="ctl"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span class="lab">Key</span><select id="keysel" aria-label="Key"></select><select id="modesel" aria-label="Scale"></select></div>
  </section>
</main>

<script>
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[ri(0,a.length-1)];
const mtof=m=>440*2**((m-69)/12), NOTES=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
const SR=44100;
let ctx,cur=null,t0=0,bpm=100,busy=false;
const go=document.getElementById('go'),info=document.getElementById('info');

function silentWav(){const n=800,b=new Uint8Array(44+n),dv=new DataView(b.buffer);
const s=(o,t)=>[...t].forEach((c,i)=>b[o+i]=c.charCodeAt(0));
s(0,'RIFF');dv.setUint32(4,36+n,true);s(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
dv.setUint32(24,8000,true);dv.setUint32(28,8000,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);s(36,'data');dv.setUint32(40,n,true);b.fill(128,44);
return 'data:audio/wav;base64,'+btoa(String.fromCharCode(...b));}

function unlockAudio(){
  try{navigator.audioSession&&(navigator.audioSession.type='playback');}catch(e){}
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  ctx.resume();
  // silent <audio> element moves iOS to the playback channel (ignores the mute switch)
  try{const a=new Audio(silentWav());a.loop=true;a.play().catch(()=>{});}catch(e){}
  const b=ctx.createBuffer(1,1,22050),s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);s.start(0);
}

// ---- synth + drum rendering (offline) ----
async function render(){
  /* tempo is global */
  const step=60/bpm/4,steps=32,oc=new OfflineAudioContext(1,Math.ceil(SR*step*steps),SR);
  const nb=oc.createBuffer(1,SR,SR),nd=nb.getChannelData(0);for(let i=0;i<SR;i++)nd[i]=Math.random()*2-1;
  const bus=oc.createGain();bus.gain.value=.75;
  const sh=oc.createWaveShaper(),cv=new Float32Array(1024);for(let i=0;i<1024;i++)cv[i]=Math.tanh((i/512-1)*1.8);sh.curve=cv;
  const cmp=oc.createDynamicsCompressor();bus.connect(sh);sh.connect(cmp);cmp.connect(oc.destination);
  const dl=oc.createDelay(1),fb=oc.createGain(),dw=oc.createGain(),dlp=oc.createBiquadFilter();
  dl.delayTime.value=step*3;fb.gain.value=rnd(.25,.45);dw.gain.value=.35;dlp.frequency.value=2500;
  dl.connect(dlp);dlp.connect(fb);fb.connect(dl);dlp.connect(dw);dw.connect(bus);
  const sw=rnd(0,.33),T=i=>i*step+(i%2?sw*step:0);

// ---- playback: both loops share the global tempo and stay phase-locked ----

// builds the audio buffer for a layer under the current loop length. Plain beats are stored twice (so a range can wrap);

// ---- intermingle: build a loop from slices of BOTH sources, then chop/stretch/hold it ----
const mixb=document.getElementById('mixb');

  const pickA=Array.from({length:S},()=>Math.random()<.5);
  if(pickA.every(Boolean))pickA[ri(1,S-1)]=false;else if(!pickA.some(Boolean))pickA[ri(1,S-1)]=true;
  for(let s=0;s<S;s++){const from=pickA[s]?a:b,lo=Math.round(s*N/S),hi=Math.round((s+1)*N/S);for(let i=lo;i<hi;i++)m[i]=from[i];}
  srcs.mix={d:m,gen:bpm};mixState='reshuffle';

// ---- melody "mix in": chop the current melody up and intermingle its slices with the playing beat loops (like Blend) ----

  for(let s=0;s<S;s++){const from=pickA[s]?0:N,lo=Math.round(s*N/S),hi=Math.round((s+1)*N/S);for(let i=lo;i<hi;i++)x[i]=m.res[from+i];}

  melChops=[0,1,2,3].map(k=>{const y=new Float32Array(N);for(let i=0;i<N;i++)y[i]=m.res[k*Bn+(i%Bn)];return chopF(y);});

  if(!on)melWas=false;
}
const toggleMelMix=()=>setMelMix(!melMix);

// ---- Auto: every 2 bars (32 steps) one random thing changes -- never the step count, BPM, key or scale ----
let autoOn=false,autoT=0,autoLast='',melBars=0,melLastT=0,melPat=null,melBlock=0;
function autoStep(){
  const melOK=!(melBlock&&ctx.currentTime<melBlock);                   // the melody may not be (re)started during its 1-bar rest
  const beats=EXCL.filter(k=>layers[k]),active=beats.find(k=>!layers[k].paused),A=[];
  const add=(name,w,fn)=>A.push({name,w,fn});
  add('new-synth',layers.synth?2:4,()=>generate('synth'));                                   // fresh loops (missing sources are favoured, so it builds up)
  add('new-808',layers.sub?2:4,()=>generate('sub'));
  beats.forEach(k=>add('shuffle-'+k,k===active?3:1.5,()=>rearrange(k)));                     // re-chop a loop
  beats.forEach(k=>{if(k!==active)add('switch-'+k,2,()=>togglePause(k));});                  // swap which beat is playing
  if(srcs.sub)add('drums',2,()=>$('dr').click());                                            // drums on/off for the 808
  if(srcs.synth&&srcs.sub)add('blend',1.5,()=>$('mixb').click());                            // blend / reshuffle the blend
  if(layers.mel||melOK)add('new-mel',layers.mel?1:3,()=>generate('mel',!!layers.mel));                            // melody: new notes + sound
  if(layers.mel){add('mel-shuffle',2,()=>rearrange('mel'));if(melOK||!layers.mel.paused)add('mel-toggle',2,()=>togglePause('mel'));if(melOK||melMix)add('mixin',2,()=>$('mm').click());}
  for(const k in hist){const h=hist[k];if(h.l.length>1)add('hist-'+k,1,()=>nav(k,h.i<=0?1:h.i>=h.l.length-1?-1:Math.random()<.5?-1:1));}   // step through history
  const pool=A.filter(a=>a.name!==autoLast),use=pool.length?pool:A,tot=use.reduce((s,a)=>s+a.w,0);
  let r=Math.random()*tot,chosen=use[0];for(const a of use){r-=a.w;if(r<=0){chosen=a;break;}}
  autoLast=chosen.name;chosen.fn();
}
function autoSchedule(){
  if(!autoOn)return;
  const st=60/bpm/4,now=ctx.currentTime;
  autoT+=32*st;if(autoT<now+.05)autoT=now+32*st;                // next 2-bar mark (re-syncs if the tab was in the background)
  setTimeout(()=>{if(!autoOn)return;autoStep();autoSchedule();},Math.max(0,(autoT-ctx.currentTime-.12)*1000));
}
function setAuto(on){
  autoOn=on;$('auto').classList.toggle('on',on);$('auto').setAttribute('aria-pressed',on);
  if(!on||!ctx)return;
  autoLast='';melBars=0;melBlock=0;melLastT=ctx.currentTime;const now=ctx.currentTime,st=60/bpm/4,ref=Object.values(layers).find(l=>l&&!l.paused&&now>=l.ref);
  if(!ref){autoStep();autoT=now;autoSchedule();return;}          // nothing playing yet: start something right away
  autoT=now+((32-gridStep(ref,now))%32)*st-32*st;autoSchedule(); // otherwise the first change lands on the loop's next 2-bar mark
}

// Auto: the same melody may sound for 8 bars at most (standalone or mixed in), then it is switched off for at least 1 bar
function melOff(){
  if(melMix)setMelMix(false,true);                                          // switch Mix in off without bringing the standalone melody back
  else if(layers.mel&&!layers.mel.paused)togglePause('mel');                // the paused note still rings out and decays
  melBlock=ctx.currentTime+16*60/bpm/4;melBars=0;                           // keep it off for one bar
}
setInterval(()=>{
  if(!autoOn||!ctx||ctx.state!=='running'){melLastT=ctx?ctx.currentTime:0;return;}
  const now=ctx.currentTime,dt=now-melLastT,pat=srcs.mel&&srcs.mel.pat;melLastT=now;
  const sounding=!!(layers.mel&&!layers.mel.paused&&now>=layers.mel.ref)||melMix;
  if(!sounding||pat!==melPat){melBars=0;melPat=pat;}                        // silence, or a new melody, restarts the count
  if(sounding){melBars+=dt/(16*60/bpm/4);if(melBars>=8)melOff();}
},100);

// Blend: if a source is missing, quietly make it first (paused, so nothing plays until the blend does)
let busyMix=false;
async function blend(){
  if(mixState==='reshuffle'){rearrange('mix');return;}
  if(busyMix)return;busyMix=true;mixb.disabled=true;mixb.classList.add('busy');
  try{for(const k of ['synth','sub'])if(!srcs[k])await generate(k,false,true);makeMix(false);}catch(e){}
  mixb.classList.remove('busy');mixb.disabled=false;busyMix=false;
}

function rearrange(k){
  if(!srcs[k]||busyL[k])return;
  if(k==='mel'){generate('mel',true,false,'pattern');return;}   // melody: new notes, same sound
  const l=layers[k],takeOver=!!l&&l.paused&&EXCL.some(x=>x!==k&&layers[x]&&!layers[x].paused);  // a different loop is playing: take over
  const res=chopF(srcs[k].d);srcs[k].plan=res.plan;play(k,res,!takeOver,srcs[k].gen);
  info.textContent=HLABEL[k]+' · SLICES REARRANGED';
}

function mute(k,at,hard){
  const l=layers[k];if(!l||l.paused)return at;
  const now=ctx.currentTime;at=Math.max(now,at||now);l.paused=true;refreshUI();
  const g=l.g.gain,v=g.value;g.cancelScheduledValues(now);g.setValueAtTime(v,now);g.setValueAtTime(v,at);
  if(k==='mel'&&!hard)return muteMel(l,at);
  g.linearRampToValueAtTime(0,at+.03);return at+.05;
}
// Melody pause: the note it is paused on is sustained into a long decay; the notes after it never play.
function muteMel(l,at){
  const g=l.g.gain,st=60/bpm/4,src=l.src,pat=src&&src.pat;
  if(!pat){g.setTargetAtTime(0,at,.3);return at+2;}
  const R=regOf(l),tr=l.trunc,step=posOf(l,at)/l.dur*32;                   // where the playhead is, in steps, when the pause lands
  const evs=[];pat.forEach((e,i)=>{                                        // the notes as they are playing now (truncated bars keep only their first steps)
    if(tr){const k=Math.floor(e.s/16),w=e.s%16;if(w<tr)evs.push({i,s:k*tr+w,len:Math.min(e.len,tr-w)});}
    else evs.push({i,s:e.s,len:e.len});
  });
  let hit=evs.find(e=>e.s<=step&&step<e.s+e.len*.92);                      // the note sounding right now
  if(!hit){let best=null;evs.forEach(e=>{if(e.s<=step&&(!best||e.s>best.s))best=e;});
    if(best&&(step-(best.s+best.len*.92))*st<.6)hit=best;}                  // or one that just ended (its tail is still ringing)
  const hb=hit&&l.holds&&l.holds.get(hit.i);
  if(hb){                                                                  // crossfade into the long held version of that note
    g.linearRampToValueAtTime(0,at+.06);
    const hs=ctx.createBufferSource(),hg=ctx.createGain();hs.buffer=hb;hs.playbackRate.value=l.rate;
    hg.gain.setValueAtTime(0,at);hg.gain.linearRampToValueAtTime(l.lvl,at+.06);hs.connect(hg);hg.connect(melBus());hs.start(at);
    l.hold={s:hs,g:hg};return at+hb.duration/l.rate+.1;
  }
  const starts=evs.map(e=>e.s).filter(s=>s>=R[0]&&s<R[1]).sort((a,b)=>a-b);   // fallback: let the baked note ring out, cut before the next one
  const nx=starts.find(s=>s>step+.01);
  const gap=(nx!==undefined?nx-step:starts.length?(R[1]-step)+(starts[0]-R[0]):8)*st;
  const tCut=at+gap-.01;
  const tFade=Math.min(at+(hit&&step<hit.s+hit.len*.92?Math.max(0,hit.s+hit.len*.92-step)*st:0),tCut-.05);
  g.setTargetAtTime(0,tFade,Math.max(.03,Math.min(.6,(tCut-tFade)/4.6)));
  g.setValueAtTime(0,tCut);
  return tCut;
}

// only one source plays at a time, and every switch lands on the next 16th note of the shared grid
// (muted loops keep running silently, so everything stays in phase)
function togglePause(key){
  const l=layers[key];if(!l)return;
  if(!l.paused){
    const now=ctx.currentTime,q=qTime(now);
    const end=mute(key,q);
    setTimeout(()=>{if(Object.values(layers).every(x=>!x||x.paused))ctx.suspend();},(end-now+.15)*1000);
  }else{
    if(key==='mel'&&melMix)setMelMix(false,true);   // starting the melody on its own switches Mix in off
    ctx.resume().then(()=>{
      const now=ctx.currentTime,q=qTime(now);
      if(l.hold)stopHold(l);
      if(EXCL.includes(key))EXCL.forEach(k=>{if(k!==key)mute(k,q);});
      l.paused=false;refreshUI();
      const g=l.g.gain,v0=g.value;g.cancelScheduledValues(now);g.setValueAtTime(v0,now);g.setValueAtTime(v0,q);g.linearRampToValueAtTime(l.lvl,q+.03);
    });
  }
}

function setTempo(v){
  bpm=v;bv.textContent=v;if(!ctx)return;const now=ctx.currentTime;
  for(const k in layers){const l=layers[k];if(!l)continue;
    const t=Math.max(now,l.ref);l.pos0=posOf(l,t);l.ref=t;l.rate=bpm/l.gen;l.s.playbackRate.value=l.rate;}
}

async function generate(key,keepState,quiet,how){
  if(key==='mel'&&melMix)quiet=true;                    // while Mix in is on, a new melody feeds the mix and stays silent on its own
  if(busyL[key])return;busyL[key]=true;const b=pads[key];b.disabled=true;b.classList.add('busy');b.querySelector('.t').textContent='Making…';
  try{
    if(ctx.state!=='running')await ctx.resume();
    await new Promise(r=>setTimeout(r,40));
    let res,txt;const gb=bpm;
    if(key==='synth'){const o=await render(),sc=sampleAndChop(o.out,1.3);res=sc.res;srcs[key]={d:sc.d,gen:gb};txt=`SYNTH · ${NOTES[o.root%12]} · TAPE`;}
    else if(key==='mel'){const cur=srcs.mel,pat=(how&&how!=='pattern'&&cur)?cur.pat:newPattern(),patch=((how==='re'||how==='pattern')&&cur)?cur.patch:newPatch();res=await renderMel(pat,patch);srcs[key]={pat,patch,gen:gb,notes:res.notes,g:res.g,res};txt=`MELODY · ${NOTES[gkey]} · ${how==='pattern'?'RESHUFFLED':how==='re'?'NEW KEY':'NEW MELODY'}`;}
    else{const raw=await render808(),dr=await renderDrums(),sc=sampleAndChop(mix808(raw,dr));res=sc.res;srcs[key]={d:sc.d,gen:gb,raw,dr,tp:sc.tp,plan:sc.plan};txt=`808 · ${NOTES[gkey]} · FOLDED`;}
    if(key!=='mel')mixState='blend';const w=play(key,res,!!keepState&&!!layers[key],gb,false,quiet);if(key==='mel'&&melMix){buildMelChop();applyMelMix();}rr[key].disabled=false;info.textContent=txt+(w>.3?' · ENTERS ON THE ONE':'');
  }catch(e){info.textContent='Error: '+e.message;}
  b.classList.remove('busy');b.querySelector('.t').textContent='New loop';b.disabled=false;busyL[key]=false;
}

(function pulse(){
  if(ctx){const now=ctx.currentTime;for(const k in layers){const l=layers[k];if(!l)continue;
    badge[k].style.transform=l.paused||now<l.ref?'':`scale(${1+.05*Math.pow(1-(phaseOf(l,now)*l.bars*4)%1,3)})`;}}
  requestAnimationFrame(pulse);
})();

document.getElementById('start').addEventListener('click',()=>{
  unlockAudio();document.getElementById('init').classList.add('hide');generate('synth');
});
pads.synth.addEventListener('click',()=>generate('synth'));
pads.sub.addEventListener('click',()=>generate('sub'));
rr.synth.addEventListener('click',()=>rearrange('synth'));
rr.sub.addEventListener('click',()=>rearrange('sub'));
mixb.addEventListener('click',blend);
for(const k in HN){$('hb'+HN[k]).addEventListener('click',()=>nav(k,-1));$('hf'+HN[k]).addEventListener('click',()=>nav(k,1));}
$('dr').addEventListener('click',()=>{drumsOn=!drumsOn;$('dr').classList.toggle('on',drumsOn);$('dr').setAttribute('aria-pressed',drumsOn);applyDrums();});
pp.mix.addEventListener('click',()=>togglePause('mix'));
pads.mel.addEventListener('click',()=>generate('mel'));
rr.mel.addEventListener('click',()=>rearrange('mel'));
pp.mel.addEventListener('click',()=>togglePause('mel'));
$('mm').addEventListener('click',toggleMelMix);
$('auto').addEventListener('click',()=>setAuto(!autoOn));
pp.synth.addEventListener('click',()=>togglePause('synth'));
pp.sub.addEventListener('click',()=>togglePause('sub'));
bpmr.addEventListener('input',()=>setTempo(+bpmr.value));
const ksel=document.getElementById('keysel'),msel=document.getElementById('modesel');
NOTES.forEach((n,i)=>ksel.add(new Option(n,i)));ksel.value=gkey;SCALES.forEach(([id,name])=>msel.add(new Option(name,id)));msel.value=gmode;
const regen=async()=>{const had=!!layers.mix;if(layers.mel)generate('mel',true,false,'re');await Promise.all(['synth','sub'].filter(k=>layers[k]).map(k=>generate(k,true)));if(had)makeMix(true);};
ksel.addEventListener('change',()=>{gkey=+ksel.value;regen();});
msel.addEventListener('change',()=>{gmode=msel.value;regen();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ctx&&ctx.state!=='running'&&Object.values(layers).some(l=>l&&!l.paused))ctx.resume();});
</script>
</body>
